data:
  source_dir: "data/classification"
  output_dir: "data/detection"
  train_split: "Train"
  val_split: "Val"
  test_split: null          
  val_test_ratio: 0.5        
  seed: 42
  keep_empty_labels: false   
  overwrite: false
  classes:
    - "Glioma"
    - "Meningioma"
    - "No Tumor"
    - "Pituitary"

training:
  model: "yolov8n.pt"
  epochs: 50
  imgsz: 640
  batch: 16
  device: null             
  workers: 4
  patience: 15
  optimizer: "auto"
  lr0: 0.01
  lrf: 0.01
  seed: 42
  project: "models/detection"
  name: "yolov8n_brain_tumor"
  augmentation:
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    degrees: 10.0
    translate: 0.1
    scale: 0.5
    shear: 2.0
    perspective: 0.0
    flipud: 0.0
    fliplr: 0.5
    mosaic: 1.0
    mixup: 0.1
    copy_paste: 0.0

evaluation:
  splits: ["val", "test"]
  imgsz: 640
  batch: 16
  conf: 0.001
  iou: 0.6
  device: null
  plots: true
  save_predictions: 8
  predict_conf: 0.25
  save_samples: 8
